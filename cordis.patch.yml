# dsh-diagram-gallery bundle patch
# 1) gallery host service: workspace scanner + loopback HTTP preview server
#    (127.0.0.1:3988 by default).
- insert:
    - id: diagram-gallery
      name: 'dsh-diagram-gallery'
# 2) opt-in filesystem Skill provider carrying the bundled Archify skill, so
#    installing this plugin alone restores the diagram-generation pipeline.
#    Resolves the packaged Skill root from the installed npm identity anchored
#    at the DSH profile (Loader baseUrl), never as a path concatenated onto
#    baseUrl. Skill is Apache-2.0 (see skills/archify/LICENSE and
#    skills/archify/THIRD_PARTY_NOTICES.md); providerName distinguishes this
#    instance from the host default and any other bundled-skill plugins.
- insert:
    - id: diagram-gallery-skill-filesystem
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: diagram-gallery-plugin
        includeDefaultRoots: false
        bundledSkillDir: !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-diagram-gallery/package.json')), 'skills')
